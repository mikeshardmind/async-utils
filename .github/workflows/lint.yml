name: Type Coverage and Linting

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]

    name: "Type Coverage and Linting @ ${{ matrix.python-version }}"
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Setup python @ ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0  # marked immutable on github, already trusting them to run this
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project @ ${{ matrix.python-version }}
        run: |
          python -m pip install .

      - name: Formatting check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          args: format --check
          version: 0.15.22  # maybe revisit this, but for now, ruff can shutup with the changes they made

      - name: Verify No CLRF line endings.
        run: >
          ! $(find . ! -path "./.git/*" -not -type d -exec file "{}" ";" |& grep -q " CRLF ")

      - name: Ensure runtime validity of annotations
        run: python _misc/_ensure_annotations.py
